<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Termofreno - Panel del camión</title>
<style>
:root{--green:#4fe08a;--amber:#ffb020;--red:#ff4b3e;--blue:#5aa7ff;--cyan:#4fd8e8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{margin:0;min-height:100vh;color:#dfe3ea;font:700 13px system-ui,sans-serif;background:repeating-linear-gradient(45deg,#14161a 0 3px,#0f1013 3px 6px);padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 16px max(12px,env(safe-area-inset-left));touch-action:manipulation}
body.alerta::after{content:"";position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 90px 10px rgba(255,40,30,.6);animation:pp .6s infinite alternate}
@keyframes pp{from{opacity:.2}to{opacity:1}}
@keyframes lat{50%{transform:scale(1.15)}}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
header{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start}
.tools{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.pill{padding:8px 12px;border-radius:99px;background:#1b1e23;border:1px solid #363a42;font-size:12px;display:flex;gap:7px;align-items:center}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--c,#666);box-shadow:0 0 8px var(--c,transparent)}
.hb{all:unset;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(#3a3e46,#22252a);border-bottom:3px solid #090a0c;cursor:pointer;font-size:19px}
.hb.on{color:var(--amber);box-shadow:0 0 12px -2px var(--amber)}
.dat{display:flex;align-items:center;gap:clamp(10px,2.4vw,34px)}
.dat div{display:flex;flex-direction:column;align-items:center;background:#05070a;border:2px solid #31353c;border-radius:14px;padding:6px clamp(14px,2.6vw,34px);box-shadow:inset 0 0 22px #000,0 3px 8px #000a;min-width:clamp(110px,16vw,200px)}
.dat small{color:#7d8591;font-size:13px;letter-spacing:2px;text-transform:uppercase}
.dat b{font-size:clamp(64px,11vw,128px);line-height:1;font-variant-numeric:tabular-nums;color:#f2f6fb}
#gear{color:var(--amber)}
.ar{font-size:clamp(60px,9vw,110px);line-height:1;color:#23262b;transition:.1s}
.ar.on{color:var(--green);text-shadow:0 0 22px var(--green)}
.fr{--c:var(--green);width:min(100%,800px);margin:14px auto 4px;padding:12px 18px;border-radius:16px;background:linear-gradient(#1c1f24,#111316);border:2px solid var(--c);box-shadow:0 0 18px -4px var(--c),inset 0 0 20px #000;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px}
.fr .tt{color:#8f97a3;letter-spacing:1.5px;text-transform:uppercase;width:100%}
.fr .n{font-size:46px;font-weight:800;color:var(--c);font-variant-numeric:tabular-nums;transform-origin:left}
.fr .sb{font-size:18px;color:var(--c);font-weight:800}
.fr.pulso{animation:pp .6s infinite alternate}.fr.pulso .n{animation:lat .6s infinite}
.bar{position:relative;width:100%;height:16px;border-radius:9px;overflow:hidden;background:linear-gradient(90deg,#4fe08a40 0 41.2%,#ffb02040 41.2% 70.6%,#ff4b3e40 70.6%)}
.bar u{position:absolute;inset:0 auto 0 0;width:0;background:var(--c);transition:width .3s}
.bar s{position:absolute;top:0;bottom:0;width:3px;background:#fff;opacity:.7}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px;margin-top:14px}
.plate{background:linear-gradient(#23262c,#17191d);border:2px solid #353941;border-radius:14px;padding:12px;box-shadow:inset 0 1px 0 #4d525b,0 6px 14px #000a}
h2{margin:0 0 10px;font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:#8f97a3;display:flex;align-items:center;gap:8px}
h2::before,h2::after{content:"";height:2px;flex:1;background:#2c3037}h2::before{flex:0 0 14px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.b,.m{all:unset;box-sizing:border-box;position:relative;cursor:pointer;text-align:center;text-transform:uppercase;letter-spacing:.5px;background:linear-gradient(#41454e,#24272d);border-bottom:5px solid #08090b;border-radius:10px;box-shadow:inset 0 1px 0 #6c727d,0 3px 5px #000a;transition:transform .06s,border-width .06s}
.b{display:flex;flex-direction:column;align-items:center;gap:5px;min-height:98px;padding:20px 6px 8px;font-size:12px;--c:var(--green)}
.b::before{content:"";position:absolute;top:7px;width:30px;height:6px;border-radius:3px;background:#101113;box-shadow:inset 0 1px 2px #000}
.b.on::before{background:var(--c);box-shadow:0 0 12px var(--c)}
.b svg{width:30px;height:30px;color:#9aa1ad}.b.on svg{color:var(--c);filter:drop-shadow(0 0 5px var(--c))}
.b .sb{display:block;font-size:10px;color:#7d8591;letter-spacing:0;text-transform:none}.b.on .sb{color:var(--c)}
.b:active,.p{transform:translateY(3px);border-bottom-width:2px}
.t{grid-column:1/-1}.t h2{margin-bottom:6px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px}
.m{display:grid;place-items:center;min-height:56px;font-size:13px}
.pausa{background:repeating-linear-gradient(-45deg,#e8b800 0 9px,#16171a 9px 18px);padding:5px;border-radius:12px;display:block;border-bottom:0}
.pausa .b{min-height:64px;padding:16px 14px 6px;--c:var(--red);background:linear-gradient(#5a2220,#34100f);color:#ffd9d6}
.pausa .b svg{color:#ff8a80}
.ed [data-kb]::after{content:attr(data-kb);position:absolute;right:4px;top:4px;background:var(--amber);color:#000;border-radius:5px;padding:1px 6px;font-size:12px;text-transform:none}
.ed .b,.ed .m{outline:2px dashed var(--amber)}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-power" viewBox="0 0 24 24"><path d="M12 2v9"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></symbol>
<symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>
<symbol id="i-park" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 17V7h3a3 3 0 0 1 0 6h-3"/></symbol>
<symbol id="i-gauge" viewBox="0 0 24 24"><path d="m12 14 4-4"/><path d="M3.3 19a10 10 0 1 1 17.4 0"/></symbol>
<symbol id="i-horn" viewBox="0 0 24 24"><path d="M3 10v4h4l6 4V6L7 10z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></symbol>
<symbol id="i-minus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/></symbol>
<symbol id="i-bulb" viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6M10 22h4"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></symbol>
<symbol id="i-hazard" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></symbol>
<symbol id="i-beacon" viewBox="0 0 24 24"><path d="M7 18a5 5 0 0 1 10 0M5 21h14M12 3v2M4.2 7.2l1.4 1.4M19.8 7.2l-1.4 1.4"/></symbol>
<symbol id="i-wiper" viewBox="0 0 24 24"><path d="M3 18a9 9 0 0 1 18 0"/><path d="M12 18 7 9"/></symbol>
<symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
<symbol id="i-lift" viewBox="0 0 24 24"><path d="m17 11-5-5-5 5M17 18l-5-5-5 5"/></symbol>
<symbol id="i-cam" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/></symbol>
<symbol id="i-map" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></symbol>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
<symbol id="i-full" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
</defs></svg>

<header>
  <div id="pz"></div>
  <div class="dat">
    <span class="ar" id="il">◀</span>
    <div><small>km/h</small><b id="vel">0</b></div>
    <div><small>marcha</small><b id="gear">N</b></div>
    <span class="ar" id="ir">▶</span>
  </div>
  <div class="tools">
    <div class="pill" id="st"><i></i><span>Conectando…</span></div>
    <button class="hb" id="snd" title="Alarma sonora">🔊</button>
    <button class="hb" id="edt" title="Cambiar teclas (toca un botón para reasignarlo)">✎</button>
    <button class="hb" id="fs" title="Pantalla completa"><svg width="22" height="22"><use href="#i-full"/></svg></button>
  </div>
</header>
<div class="fr" id="fr"><span class="tt">Temperatura de frenos</span>
  <span class="n" id="tmp">25.0 °C</span><span class="sb" id="tms">Óptimo</span>
  <div class="bar"><u id="tmb"></u><s style="left:41.2%"></s><s style="left:70.6%"></s></div></div>
<main id="app"></main>

<script>
/* ===== AJUSTES ===== */
const TEMP_ALERTA = 200;  // desde aquí: barra naranja + pitido discreto
const TEMP_ROJO   = 325;  // 50 % de eficacia perdida: rojo + alarma fuerte + latido
const TEMP_MAX    = 450;  // sin frenos
const NIVELES_LIMPIADORES = 3;
/* Botones: t título · k tecla por defecto · i icono · c color · on(e) cuándo se enciende · s(e) texto
   hold: se mantiene mientras lo tocas · loc: interruptor local · sub: grupo de botones
   TIP: para cambiar una tecla SIN tocar código, pulsa ✎ arriba y toca el botón. */
const GRUPOS = [
 ['Conducción', [
  {t:'Eléctrico', k:'x', i:'bolt', c:'cyan', on:e=>e.electrico, s:e=>e.electrico?'Encendido':'Apagado'},
  {t:'Ignición', k:'e', i:'power', c:'green', on:e=>e.motor, s:e=>e.motor?'Motor en marcha':'Motor apagado'},
  {t:'Freno de mano', k:'space', i:'park', c:'red', on:e=>e.freno_mano, s:e=>e.freno_mano?'Puesto':'Suelto'},
  {t:'Crucero', k:'c', i:'gauge', c:'green', on:e=>e.crucero, s:e=>e.crucero?'Activo':'Apagado'},
  {t:'Bocina', k:'h', i:'horn', c:'amber', hold:1},
  {t:'Retarder −', k:'j', i:'minus', c:'blue'},
  {t:'Retarder +', k:';', i:'plus', c:'blue'}]],
 ['Luces', [
  {t:'Luces', k:'l', i:'bulb', c:'green', on:e=>e.luces>0, s:e=>['Apagadas','Cortesía','Bajas'][e.luces]},
  {t:'Luces altas', k:'k', i:'sun', c:'blue', on:e=>e.altas},
  {t:'Emergencia', k:'f', i:'hazard', c:'amber', on:e=>e.hazards},
  {t:'Torretas', k:'o', i:'beacon', c:'amber', on:e=>e.torretas},
  {t:'Limpiadores', k:'p', i:'wiper', c:'cyan', wip:1}]],
 ['Remolque y suspensión', [
  {t:'Enganche remolque', k:'t', i:'link', c:'green', on:e=>e.remolque, s:e=>e.remolque?'Enganchado':'Sin remolque'},
  {t:'Bloqueo diferencial', k:'v', i:'lock', c:'amber', loc:1},
  {t:'Eje retráctil', k:'u', i:'lift', c:'blue', loc:1},
  {t:'Suspensión camión', sub:[['▲ Delantera','q',1],['▼ Delantera','a',1],['▲ Trasera','w',1],['▼ Trasera','s',1]]},
  {t:'Suspensión remolque', sub:[['▲ Subir','i',1],['▼ Bajar','d',1],['Reset','r']]}]],
 ['Vista', [
  {t:'Cámara interior', k:'1', i:'cam', c:'blue'},
  {t:'Cámara exterior', k:'2', i:'cam', c:'blue'},
  {t:'Mapa / GPS', k:'m', i:'map', c:'green'}]]
];
const PAUSA = {t:'Pausa', k:'escape', i:'menu', c:'red'};   // esquina superior izquierda
/* ==================== */

const $ = id => document.getElementById(id);
const ic = n => `<svg><use href="#i-${n}"/></svg>`;
const send = (p,k) => fetch('/'+p+'?key='+encodeURIComponent(k)).catch(()=>{});
const buzz = () => { try { navigator.vibrate && navigator.vibrate(10); } catch(_){} };
const ver = []; let E = {}, nivel = 0, hasta = 0, edit = false, MAP = {};
try { MAP = JSON.parse(localStorage.getItem('teclas')||'{}'); } catch(_){}
const K = (id,def) => MAP[id] || def;

function editar(id,def){
  let n = prompt(id+'\nTecla actual: '+K(id,def)+'\nNueva tecla (vacío = original):', K(id,def));
  if(n === null) return;
  n = n.trim().toLowerCase();
  if(n && n !== def) MAP[id] = n; else delete MAP[id];
  try { localStorage.setItem('teclas',JSON.stringify(MAP)); } catch(_){}
  refrescarKeys();
}
const refrescarKeys = () => document.querySelectorAll('[data-id]').forEach(e => e.dataset.kb = K(e.dataset.id,e.dataset.def));

function mantener(el,id,def){
  let iv = null, k;
  const dn = ev => { ev.preventDefault(); if(edit){ editar(id,def); return; } if(iv) return; k = K(id,def); el.classList.add('p'); buzz(); send('down',k); iv = setInterval(()=>send('down',k),5000); };
  const up = () => { if(!iv) return; clearInterval(iv); iv = null; el.classList.remove('p'); send('up',k); };
  el.addEventListener('pointerdown',dn);
  ['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,up));
  el.style.touchAction = 'none';
}

function boton(b){
  const el = document.createElement('button'); el.className = 'b'; el.style.setProperty('--c',`var(--${b.c})`);
  el.dataset.id = b.t; el.dataset.def = b.k;
  el.innerHTML = `${ic(b.i)}<span>${b.t}</span><span class="sb"></span>`;
  const sb = el.querySelector('.sb'); let local = false;
  if(b.hold) mantener(el,b.t,b.k);
  else el.onclick = () => {
    if(edit) return editar(b.t,b.k);
    buzz(); send('press',K(b.t,b.k));
    if(b.loc){ local = !local; pintar(); }
    if(b.wip){ nivel = (nivel+1) % (NIVELES_LIMPIADORES+1); hasta = Date.now()+900; pintar(); }
  };
  const pintar = () => {
    let on = false, txt = '';
    if(b.wip){ on = nivel>0; txt = on ? 'Nivel '+nivel+' de '+NIVELES_LIMPIADORES : 'Apagados'; }
    else if(b.loc){ on = local; txt = on ? 'Activo' : 'Manual'; }
    else if(b.on){ on = !!b.on(E); txt = b.s ? (b.s(E)||'') : ''; }
    el.classList.toggle('on',on); sb.textContent = txt;
  };
  pintar(); ver.push(pintar); return el;
}

function construir(){
  const pz = document.createElement('div'); pz.className = 'pausa'; pz.appendChild(boton(PAUSA)); $('pz').appendChild(pz);
  for(const [nombre,lista] of GRUPOS){
    const p = document.createElement('section'); p.className = 'plate';
    p.innerHTML = `<h2>${nombre}</h2>`; const g = document.createElement('div'); g.className = 'g'; p.appendChild(g);
    for(const b of lista){
      if(b.sub){
        const t = document.createElement('div'); t.className = 't'; t.innerHTML = `<h2>${b.t}</h2><div class="row"></div>`;
        for(const [txt,k,h] of b.sub){
          const id = b.t+' '+txt, m = document.createElement('button'); m.className = 'm'; m.textContent = txt;
          m.dataset.id = id; m.dataset.def = k;
          if(h) mantener(m,id,k); else m.onclick = () => { if(edit) return editar(id,k); buzz(); send('press',K(id,k)); };
          t.lastChild.appendChild(m);
        }
        g.appendChild(t);
      } else g.appendChild(boton(b));
    }
    $('app').appendChild(p);
  }
  refrescarKeys();
}

/* ---- Alarma sonora ---- */
let ac = null, mudo = false, ult = 0;
document.addEventListener('pointerdown',()=>{ try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); ac.state==='suspended' && ac.resume(); }catch(_){} },{passive:true});
function tono(f,d,g,tipo){
  if(!ac || mudo) return;
  const o = ac.createOscillator(), v = ac.createGain(), t = ac.currentTime;
  o.type = tipo; o.frequency.value = f; o.connect(v); v.connect(ac.destination);
  v.gain.setValueAtTime(0,t); v.gain.linearRampToValueAtTime(g,t+.01); v.gain.linearRampToValueAtTime(0,t+d);
  o.start(t); o.stop(t+d+.02);
}
function alarma(t){
  const n = performance.now();
  if(t >= TEMP_ROJO){
    if(n-ult > (t>=TEMP_MAX ? 450 : 750)){ ult = n; tono(880,.18,.55,'square'); setTimeout(()=>tono(1250,.18,.55,'square'),210); }
  } else if(t >= TEMP_ALERTA && n-ult > 2500){ ult = n; tono(1000,.12,.12,'sine'); }
}
$('snd').onclick = () => { mudo = !mudo; $('snd').textContent = mudo ? '🔇' : '🔊'; };
$('edt').onclick = () => { edit = !edit; document.body.classList.toggle('ed',edit); $('edt').classList.toggle('on',edit); };
$('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>{});
document.addEventListener('contextmenu', e => e.preventDefault());

function estado(modo){
  const [c,txt] = {on:['#4fe08a','En línea'], wait:['#ffb020','Esperando al juego'], pause:['#ffb020','Juego en pausa'], off:['#ff4b3e','Servidor sin conexión']}[modo];
  $('st').style.setProperty('--c',c); $('st').lastChild.textContent = txt;
}

function aplicar(d){
  estado(!d.conectado ? 'wait' : d.pausado ? 'pause' : 'on');
  $('vel').textContent = d.vel.toFixed(0); $('gear').textContent = d.gear;
  const t = d.temp, ef = Math.round(Math.max(0,Math.min(1,1-(t-TEMP_ALERTA)/(TEMP_MAX-TEMP_ALERTA)))*100);
  $('tmp').textContent = t.toFixed(1)+' °C';
  $('tmb').style.width = Math.max(2,Math.min(100,(t-25)/(TEMP_MAX-25)*100))+'%';
  const [col,txt] = t>=TEMP_MAX ? ['red','¡CRISTALIZADO! SIN FRENOS'] : t>=TEMP_ROJO ? ['red','¡PELIGRO! Eficacia '+ef+'%'] : t>=TEMP_ALERTA ? ['amber','Fading · Eficacia '+ef+'%'] : ['green','Óptimo'];
  $('fr').style.setProperty('--c',`var(--${col})`); $('tms').textContent = txt;
  const rojo = t >= TEMP_ROJO;
  $('fr').classList.toggle('pulso',rojo); document.body.classList.toggle('alerta',rojo);
  if(d.conectado && !d.pausado) alarma(t);
  if(d.conectado && d.est){
    E = d.est;
    if(Date.now() > hasta){ if(!E.limpiadores) nivel = 0; else if(nivel === 0) nivel = 1; }
    $('il').classList.toggle('on',!!E.int_izq); $('ir').classList.toggle('on',!!E.int_der);
    ver.forEach(f => f());
  }
}
async function ciclo(){
  try { aplicar(await (await fetch('/data',{cache:'no-store'})).json()); } catch(_){ estado('off'); }
  setTimeout(ciclo,250);
}
construir(); ciclo();
</script></body></html>
